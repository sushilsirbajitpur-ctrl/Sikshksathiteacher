<style>

</style></head><body><main>

</div>

<div class="box">

</main>
<div id="cm" class="h"><div class="vi"><video id="vid" playsinline muted></video><canvas id="ov"></canvas></div><div id="cs"></div><div style="text-align:center;padding:0 8px 10px"><button class="btn g" style="color:#fff" onclick="shot(CAM&&CAM.last)">📸 अभी खींचें</button><button class="btn" onclick="camClose()">✓ पूरा हुआ (<span id="cn">0</span>)</button></div></div>

 <button class="btn" onclick="eDone()">✓ हो गया</button><button class="btn g" onclick="eAuto()">🎯 अपने-आप</button><button class="btn g" onclick="eFull()">पूरा पन्ना</button><button class="btn g" onclick="eRot()">↻ घुमाएँ</button><button class="btn g" onclick="eCancel()">रद्द</button>
</div>
<script>

function detect(el,sw,sh){

 var d=x.getImageData(0,0,W,H).data,g=new Uint8Array(N),hs=new Uint32Array(256),i,k,sum=0,sb=0,wb=0,mx=0,th=128;

/* ऑटो स्कैन: पन्ना मिलने के बाद लगभग 1 सेकंड स्थिर रहे तो अपने-आप खींचता है */
var CAM=null;
async function camOpen(){

 var v=$("vid");v.srcObject=st;try{await v.play()}catch(e){}

  if(ov.width!==cw||ov.height!==ch){ov.width=cw;ov.height=ch}
  var r=detect(v,v.videoWidth,v.videoHeight),x=ov.getContext("2d"),vw=v.videoWidth,vh=v.videoHeight,s=Math.min(cw/vw,ch/vh),ox=(cw-vw*s)/2,oy=(ch-vh*s)/2;
